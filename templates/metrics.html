{% extends 'base.html' %}
{% block title %}Metrics{% endblock %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-secondary text-white">
          <h2 class="h5 mb-0">Question Accuracy Metrics</h2>
        </div>
        <div class="card-body" id="metricsBody">
          <div>Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async function() {
  try {
    const r = await fetch('/api/metrics');
    const d = await r.json();
    const el = document.getElementById('metricsBody');
    el.innerHTML = `
      <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between"><span>Total Questions</span><span>${d.total_questions}</span></li>
        <li class="list-group-item d-flex justify-content-between"><span>Validated</span><span>${d.validated}</span></li>
        <li class="list-group-item d-flex justify-content-between"><span>Flagged</span><span>${d.flagged}</span></li>
        <li class="list-group-item d-flex justify-content-between"><span>Validation Rate</span><span>${d.validation_rate.toFixed(2)}%</span></li>
        <li class="list-group-item d-flex justify-content-between"><span>Avg Confidence</span><span>${d.avg_confidence.toFixed(2)}</span></li>
      </ul>
    `;
  } catch(e) {
    document.getElementById('metricsBody').textContent = 'Failed to load metrics';
  }
});
</script>
{% endblock %}
